}

tasks.named("compileGraalJava") {
    dependsOn(browserMinecraftJar)
}

tasks.register("graalWebImage", Exec) {
    group = "build"
    description = "Compile a Minecraft JAR entry point with GraalVM Web Image."
    dependsOn("compileGraalJava", "featureClasses", browserMinecraftJar)
    // WasmLM images need the builder patch: without it every `@JS` bridge in this
    // repo silently compiles to a null-returning stub. WASMGC does not -- except on
    // Windows, where the same task also produces the points-to patch that gets the
    // build past GraalVM's @Delete single-callee check.
    if (graalBackend != "WASMGC"
            || System.getProperty("os.name").toLowerCase().contains("windows")) {
        dependsOn("webImagePatch")
    }

    def outputDirectory = layout.buildDirectory.dir("graal")
    def minimalProbeMains = [
            defaultGraalMain,
            "dev.mcweb.graal.GraalMinecraftGpuProbe",
            "dev.mcweb.graal.GraalGuavaCacheProbe",
            "dev.mcweb.graal.ThreadConformanceMain",
            "dev.mcweb.graal.WorkerPoolProbeMain",
            "dev.mcweb.graal.SkinFetchProbeMain",
            "dev.mcweb.graal.SkinProfileVerificationProbeMain",
            "dev.mcweb.graal.WasmLMBootstrapProbeMain",
            "dev.mcweb.graal.WasmLMUtilProbeMain"
    ]
    def probeLibraryPrefixes = [
            "commons-lang3-",
            "datafixerupper-",
            "failureaccess-",
            "fastutil-",
            "gson-",
            "guava-",
            "joml-",
            "jspecify-",
            "slf4j-api-"
    ]
    def selectedProbeLibraryPrefixes = selectedGraalMain ==
            "dev.mcweb.graal.SkinProfileVerificationProbeMain"
            ? ["authlib-", "commons-io-"]
            : []
    def probeLibraries = minecraftLibraries.findAll { library ->
        (probeLibraryPrefixes + selectedProbeLibraryPrefixes).any {
            library.name.startsWith(it)
        }
    }
    def useMinimalImageClasspath = minimalProbeMains.contains(selectedGraalMain)
    def serverWorkerMain = "dev.mcweb.graal.BrowserWorkerServerMain"
    def includeClientAssets = selectedGraalMain != serverWorkerMain
            || providers.gradleProperty("graalIncludeClientAssets").map { it == "true" }.getOrElse(false)
    def transformedMinecraftJar = browserMinecraftJar.flatMap { it.archiveFile }
    def fullImageLibraries = minecraftLibraries.findAll { library ->
        !library.name.startsWith("log4j-")
                && !library.name.startsWith("logging-")
                && !library.name.startsWith("jtracy-")
                // Netty's transport/handler/resolver stacks pull in
                // sun.nio.ch selectors -> Poller -> virtual threads, which
                // the LTS wasm backend cannot compile. The util/buffer/codec
                // layers stay: core classes (FriendlyByteBuf,
                // ResourceLeakDetector, ByteBufCodecs' exceptions) reference
                // them; codecs are pure ByteBuf transforms with no NIO. The
                // browser logging override keeps java.util.logging out of
                // the buffer layer's static init.
                && !library.name.startsWith("netty-transport")
                && !library.name.startsWith("netty-handler")
                && !library.name.startsWith("netty-resolver")
    }
    def imageClasspath = useMinimalImageClasspath
            ? files(sourceSets.graal.output, sourceSets.feature.output, transformedMinecraftJar, probeLibraries)
            : files(sourceSets.graal.output, sourceSets.feature.output, transformedMinecraftJar, fullImageLibraries)
    inputs.files(imageClasspath)
    outputs.files(
            outputDirectory.map { it.file("${graalOutputName}.js") },
            outputDirectory.map { it.file("${graalOutputName}.js.wasm") }
    )

    doFirst {
        if (!graalVmHome.isPresent()) {
            throw new GradleException(
                    "Set GRAALVM_HOME or -PgraalVmHome to Oracle GraalVM Web Image 25.1+"
            )
        }

        // GraalVM ships native-image as a batch launcher on Windows. Prefer the
        // real executable it wraps: this image's classpath is 50+ jars, and a
        // .cmd is run through cmd.exe, whose command line caps at 8191
        // characters -- over which it fails with exit 255 and no output at all.
        // CreateProcess allows 32767, so invoking the exe directly clears it.
        def onWindows = System.getProperty("os.name").toLowerCase().contains("windows")
        def nativeImage = file("${graalVmHome.get()}/bin/native-image")
        if (onWindows) {
            def direct = file("${graalVmHome.get()}/lib/svm/bin/native-image.exe")
            nativeImage = direct.isFile() ? direct : file("${graalVmHome.get()}/bin/native-image.cmd")
        }
        if (!nativeImage.isFile()) {
            throw new GradleException("native-image was not found at ${nativeImage}")
        }

        def tempDirectory = layout.buildDirectory.dir("tmp/graal-web-image").get().asFile
        def outputFile = outputDirectory.get().file(graalOutputName).asFile
        tempDirectory.mkdirs()
        outputFile.parentFile.mkdirs()

        environment("TMPDIR", tempDirectory.absolutePath)
        // svm-wasm requires Binaryen's wasm-as on PATH. Accept a system
        // install or the checked-out ~/tools/binaryen*/bin tree.
        def binaryenBin = [
                new File(System.getProperty("user.home"), "tools/binaryen-version_126/bin"),
                new File(System.getProperty("user.home"), "tools/binaryen/bin")
        ].find { it.isDirectory() && new File(it, "wasm-as").isFile() }
        if (binaryenBin != null) {
            environment("PATH", "${binaryenBin.absolutePath}${File.pathSeparator}${System.getenv("PATH")}")
        }
        def nativeImageCommand = [
                nativeImage.absolutePath,
                "-J-Djava.io.tmpdir=${tempDirectory.absolutePath}",
                "--tool:svm-wasm",
                // Netty in pure-Java mode: skips Unsafe/VarHandle/foreign
                // probes that the wasm backend cannot compile (double CAS
                // accessors, foreign-linker MethodHandle WAT).
                "-Dio.netty.noUnsafe=true",
                "-Dio.netty.noPreferDirect=true",
                // BrowserParkerFeature registers the Parker factory the wasm
                // backend omits. It touches SVM-internal classes, which the
                // builder module does not export to the unnamed module, and
                // ServiceLoader discovery misses directory classpath entries,
                // so the feature is wired explicitly.
                "-J--add-exports=org.graalvm.nativeimage.builder/com.oracle.svm.core.thread=ALL-UNNAMED",
                "-J--add-opens=org.graalvm.nativeimage.builder/com.oracle.svm.core.thread=ALL-UNNAMED",
                "--features=dev.mcweb.feature.BrowserParkerFeature",
                // Target_LockSupport_Web is a @TargetClass substitution on the
                // image classpath (the only way to give the browser a
                // LockSupport that does not call the throwing Unsafe.park/
                // unpark). LockSupport has no built-in substitution to lose to.
                "-H:+AllowDeprecatedBuilderClassesOnImageClasspath",
                // The feature registers build-time singleton objects; their
                // classes must be build-time initialized to live in the heap.
                "--initialize-at-build-time=dev.mcweb.feature",
                // wasm-as can legitimately spend several minutes reading and
                // assembling the generated module without Java-side activity.
                // The image watchdog sees that subprocess read as a deadlock and
                // aborts an otherwise healthy build; the assembler is the owner of
                // progress in this phase, so do not terminate on the quiet interval.
                "-H:-DeadlockWatchdogExitOnTimeout",
                // build-report is opt-in (-PgraalBuildReport=true): it keeps
                // analysis data alive to render the report, which is memory this
                // build cannot spare on a small host.
                // -O1: with the frame pump, runTick pulls the whole tick/render
                // graph into compilation; -O2 inlines it into one wasm function
                // past V8's 7,654,321-byte limit, and -Ob emits even bulkier
                // code. -O1 keeps functions under the limit.
                "-O1",
                // V8 rejects any wasm function larger than 7,654,321 bytes.
                // The SVM image-heap filler (fillHeapObjects*) emitted one
                // ~10.5 MiB part at the 100k-objects default once the frame
                // pump pulled the tick/render graph into the build-time heap.
                // 10k objects per filler function keeps every part well under
                // the limit; instantiation simply runs more, smaller fillers.
                "-H:ImageHeapObjectsPerFunction=10000",
                // The VirtualThread/Thread.isInterrupted analysis wall is
                // handled by Web Image's built-in Target_java_lang_VirtualThread_Web,
                // not by a flag: -H:+ReportUnsupportedElementsAtRuntime was tried and
                // does not defer it (it arrives as an UnresolvedElementException
                // during constant-pool resolution, before reachability).
                "-H:+PrintImageHeapPartitionSizes"
        ]
        if (graalDebugNames) {
            // Applies to both backends, so it sits outside the WasmLM block —
            // that is where these two lines were first (wrongly) put, and the
            // WASMGC build silently ignored them.
            //
            // Both flags are needed. -H:+DebugNames keeps the symbolic names in
            // the emitted .wat; the wrapper forces `wasm-as -g`, without which
            // Binaryen drops them and the binary carries no `name` section, so
            // every Java frame profiles as `wasm-function[12345]`.
            nativeImageCommand.add("-H:+DebugNames")
            nativeImageCommand.add("-H:+UseBinaryen")
            nativeImageCommand.add(
                    "-H:WasmAsPath=${rootDir}/tools/wasm-as-debugnames".toString())
        }
        if (graalBackend != "WASMGC") {
            // Selecting a non-default backend takes three things, none of them
            // documented together:
            //   1. `Backend=` must appear in ProvidedHostedOptions in
            //      $GRAALVM_HOME/lib/svm/tools/svm-wasm/native-image.properties.
            //      The stock file omits it, so the driver rejects -H:Backend
            //      as "Unrecognized option" before the builder ever starts.
            //   2. WebImagePlatformInjector hard-forces WASMGC whenever
            //      `com.oracle.graalvm.iswebimage` is not set on the builder
            //      JVM -- without it -H:Backend=WASM is accepted and silently
            //      ignored (you get a Wasm-GC image with no linear memory).
            //   3. WasmLM assembles through wat2wasm by default; this repo has
            //      Binaryen, not wabt, so route it through wasm-as instead.
            //   4. The builder patch (task `webImagePatch`) supplies the `@JS`
            //      lowering and the real `Thread.start0` the stock backend lacks.
            nativeImageCommand.add("-J-Dcom.oracle.graalvm.iswebimage=true")
            nativeImageCommand.add("-H:Backend=${graalBackend}".toString())
            nativeImageCommand.add("-H:+UseBinaryen")
            nativeImageCommand.add(
                    "-J--patch-module=org.graalvm.extraimage.builder=${webImagePatchDir.get().asFile.absolutePath}".toString()
            )
            nativeImageCommand.add(
                    "-J--patch-module=org.graalvm.nativeimage.builder=${layout.buildDirectory.dir("webimage-patch/svm-classes").get().asFile.absolutePath}".toString()
            )
        }
        // Windows only, and OUTSIDE the WasmLM branch above: WASMGC is the backend
        // this project ships, and the @Delete check fires there too. macOS and
        // Linux never reach it, so their builder stays stock.
        def pointstoPatch = layout.buildDirectory.dir("webimage-patch/pointsto-classes").get().asFile
        if (onWindows && pointstoPatch.isDirectory()) {
            nativeImageCommand.add(
                    "-J--patch-module=org.graalvm.nativeimage.pointsto=${pointstoPatch.absolutePath}".toString()
            )
        }
        if (!useMinimalImageClasspath) {
            // The real client loads its built-in language, shaders, textures,
            // models, and pack marker through Class.getResource*. Web Image
            // only embeds classpath resources selected explicitly, so retain
            // the supplied JAR's actual client asset tree in the full image,
            // plus the generated asset index the browser resource pack lists
            // from (embedded resources cannot be enumerated otherwise).
            // The data tree is a later integrated-server checkpoint; repeating
            // this option would rescan the complete classpath for every regex.
            // The SLF4J ServiceLoader registration (src/graal/resources) must be
            // embedded or the browser logging provider is invisible and Mojang's
            // own logs (incl. texture/reload errors) fall back to the NOP logger.
            def resourcePattern = includeClientAssets
                    ? "((assets|data)/.*|mcweb-asset-index\\.txt|com/ibm/icu/.*|META-INF/services/org\\.slf4j\\.spi\\.SLF4JServiceProvider)"
                    : "(data/.*|com/ibm/icu/.*|META-INF/services/org\\.slf4j\\.spi\\.SLF4JServiceProvider)"
            nativeImageCommand.add("-H:IncludeResources=${resourcePattern}")
            // Minecraft constructor allocates registries, language, and buffers
            // far beyond default wasm ergonomics. On the 25.0.3 LTS wasm
            // backend the run-time heap cap is a -R: runtime option.
            nativeImageCommand.add("-H:+UnlockExperimentalVMOptions")
            nativeImageCommand.add("-R:MaxHeapSize=${graalMaxHeapSize}")
        }
        if (providers.gradleProperty("graalBuildReport").getOrElse("false") == "true") {
            nativeImageCommand.addAll(["--emit", "build-report"])
        }
        if (graalBuilderMemoryGb > 0) {
            nativeImageCommand.add("-J-Xmx${graalBuilderMemoryGb}g".toString())
            // Throughput-biased collection lowers peak RSS in the builder, which
            // is what actually decides whether a small host finishes at all.
            nativeImageCommand.add("-J-XX:GCTimeRatio=19")
        }
        if (graalParallelism > 0) {
            nativeImageCommand.add("--parallelism=${graalParallelism}".toString())
        }
        logger.lifecycle("Image build sizing: ${hostCpus} cpus, ${hostMemoryGb} GB host"
                + " -> ${graalBuilderMemoryGb} GB builder heap, parallelism ${graalParallelism}")

        // Escape hatch for host-specific flags the build cannot know about.
        // Windows needs -H:-CheckToolchain when the C compiler is the
        // open-source stand-in from tools/oss-toolchain.mjs: native-image
        // otherwise insists on Microsoft's exact cl.exe banner. The flag skips
        // identifying the compiler, not using it.
        def graalExtraArgs = providers.gradleProperty("graalExtraArgs").getOrElse("")
        if (!graalExtraArgs.isEmpty()) {
            nativeImageCommand.addAll(graalExtraArgs.split(" ").findAll { !it.isEmpty() })
        }
        nativeImageCommand.addAll([
                "-cp", imageClasspath.asPath,
                selectedGraalMain,
                outputFile.absolutePath
        ])
        commandLine(nativeImageCommand)
    }

    doLast {
        // The standard page cache-busts both halves of a Web Image pair. A
        // query on the generated loader would normally make Web Image derive
        // `loader.js?v=...wasm`; give it the explicit sibling Wasm URL supplied
        // by webgpu-host instead. Keep this exact-counted so a builder update
        // cannot silently reintroduce a mixed cached-loader/fresh-Wasm ABI.
        def loader = outputDirectory.get().file("${graalOutputName}.js").asFile
        // Normalise line endings first: Web Image writes the loader with CRLF on
        // Windows, and the needle below is written with LF, so the exact-count
        // check found 0 and failed a build whose image had already succeeded.
        // JavaScript is indifferent to which we write back.
        def source = loader.getText("UTF-8").replace("\r\n", "\n")
        // Oracle GraalVM 25.2 keeps the same auto-run bootstrap but rethrows
        // the rejection after logging it. Accept that exact upstream variant
        // as well as the older catch(console.error) spelling; either way the
        // replacement remains fail-closed if the Web Image shape changes.
        def configBootstrap = "const config = new GraalVM.Config();\n"
        def runBootstrap = "GraalVM.run(load_cmd_args(),config)"
        def needles = [
                configBootstrap + runBootstrap + ".catch(console.error);",
                configBootstrap + runBootstrap + ".catch(e => { console.error(e); throw e; });"
        ]
        def matchingNeedles = needles.findAll { source.count(it) == 1 }
        def matches = needles.collect { source.count(it) }.sum()
        if (matchingNeedles.size() != 1 || matches != 1) {
            throw new GradleException(
                    "Expected exactly one Web Image config bootstrap in ${loader}, found ${matches}"
            )
        }
        def needle = matchingNeedles[0]
        def replacement = (configBootstrap
                + "if (typeof globalThis !== \"undefined\" && globalThis.mcWebGraalWasmPath) {\n"
                + "    config.wasm_path = globalThis.mcWebGraalWasmPath;\n"
                + "}\n"
                + runBootstrap
                + needle.substring((configBootstrap + runBootstrap).length()))
        loader.setText(source.replace(needle, replacement), "UTF-8")
    }
}

// Minecraft's sound files are not in the client JAR. They live in the launcher's
// content-addressed asset store, keyed by an index whose id comes from the
// version manifest -- 26.2 uses index 32 (4871 .ogg objects plus sounds.json).
// The browser resolves sound events against sounds.json at runtime, so both the
// index's virtual names and the objects have to be reachable over HTTP.
def minecraftAssetIndexId = "32"
def minecraftAssetsRoot = {
    def explicit = project.findProperty("mcAssetsDir") ?: System.getenv("MC_ASSETS_DIR")
    if (explicit) {
        return new File(explicit.toString())
    }
    def home = System.getProperty("user.home")
    return new File(home, ".minecraft/assets").with { it.isDirectory() ? it : null }
}()

tasks.register("stageMinecraftAudio") {
    group = "build"
    description = "Link Minecraft's sounds.json and .ogg assets next to the browser page."

    def stageRoot = layout.buildDirectory.dir("web-graal/mcweb-audio").get().asFile
    def marker = new File(stageRoot, ".staged-${minecraftAssetIndexId}")
    def indexFile = minecraftAssetsRoot == null
            ? null
            : new File(minecraftAssetsRoot, "indexes/${minecraftAssetIndexId}.json")

    if (indexFile != null && indexFile.isFile()) {
        inputs.file(indexFile)
    }
    // The staged tree is deliberately not declared as an output directory: it
    // shares build/web-graal with stageGraalWeb, and overlapping output dirs
    // make Gradle disable up-to-date checks for both. The marker carries the
    // incrementality instead.
    outputs.file(marker)

    doLast {
        if (indexFile == null || !indexFile.isFile()) {
            logger.warn(
                    "No Minecraft asset index {} found under the official launcher's .minecraft/assets; "
                            + "override with -PmcAssetsDir=...). The browser will run silently.",
                    minecraftAssetIndexId
            )
            stageRoot.mkdirs()
            marker.text = "unavailable\n"
            return
        }

        def objectsRoot = new File(minecraftAssetsRoot, "objects")
        def index = new groovy.json.JsonSlurper().parse(indexFile)
        def linked = 0
        def copied = 0
        def skipped = 0

        index.objects.each { name, entry ->
            boolean wanted = name.endsWith("/sounds.json") || (name.contains("/sounds/") && name.endsWith(".ogg"))
            if (!wanted) {
                return
            }

            def hash = entry.hash
            def source = new File(objectsRoot, "${hash.substring(0, 2)}/${hash}")
            if (!source.isFile()) {
                return
            }

            def target = new File(stageRoot, name)
            if (target.isFile() && target.length() == source.length()) {
                skipped++
                return
            }

            target.parentFile.mkdirs()
            target.delete()
            try {
                // Hard links keep 477 MB of audio off the build directory.
                java.nio.file.Files.createLink(target.toPath(), source.toPath())
                linked++
            } catch (Exception crossDevice) {
                java.nio.file.Files.copy(source.toPath(), target.toPath())
                copied++
            }
        }

        marker.text = "index=${minecraftAssetIndexId} linked=${linked} copied=${copied} reused=${skipped}\n"
        logger.lifecycle(
                "staged Minecraft audio: {} linked, {} copied, {} already present",
                linked, copied, skipped
        )
    }
}

def wasmLMThreadOutputName = "${graalOutputName}-threaded"
tasks.register("wasmLMThreadArtifacts", Exec) {
    group = "build"
    description = "Rewrite a WasmLM image for shared memory and stage its thread-agent variant."
    dependsOn("graalWebImage")
    onlyIf { graalBackend != "WASMGC" }
    def graalDirectory = layout.buildDirectory.dir("graal")
    inputs.files(
            graalDirectory.map { it.file("${graalOutputName}.js") },
            graalDirectory.map { it.file("${graalOutputName}.js.wasm") }
    )
    inputs.file(file("tools/stage-wasmlm-browser.mjs"))
    inputs.file(file("tools/wasm-share-memory.mjs"))
    outputs.files(
            graalDirectory.map { it.file("${wasmLMThreadOutputName}.js") },
            graalDirectory.map { it.file("${wasmLMThreadOutputName}.js.wasm") },
            graalDirectory.map { it.file("${wasmLMThreadOutputName}-agent.js.wasm") }
    )
    doFirst {
        commandLine(
                "node",
                file("tools/stage-wasmlm-browser.mjs").absolutePath,
                graalDirectory.get().file("${graalOutputName}.js").asFile.absolutePath,
                graalDirectory.get().file("${graalOutputName}.js.wasm").asFile.absolutePath,
                graalDirectory.get().file(wasmLMThreadOutputName).asFile.absolutePath,
                "65536"
        )
    }
}

tasks.register("stageGraalWeb", Copy) {
    group = "build"
    description = "Stage the GraalVM Web Image artifact and browser host."
    dependsOn("graalWebImage")
    if (graalBackend != "WASMGC" && selectedGraalMain != serverWorkerGraalMain) {
        dependsOn("wasmLMThreadArtifacts")
    }
    mustRunAfter("stageMinecraftAudio")
    from(layout.projectDirectory.dir("web"))
    // The private server Worker owns a private, non-shared heap.  It must use
    // the original WasmLM loader/image: the shared-memory rewrite expects the
    // main page to provide mcWebSharedMemory and fails inside a standalone
    // Worker before Java starts.  Only the client image gets the threaded
    // loader/agent pair.
    if (graalBackend == "WASMGC" || selectedGraalMain == serverWorkerGraalMain) {
        from(layout.buildDirectory.dir("graal")) {
            include("${graalOutputName}.js")
            include("${graalOutputName}.js.wasm")
            into("graal")
        }
    } else {
        // The browser image name is the public artifact name.  The rewrite
        // task uses a suffixed temporary name so its inputs and outputs do
        // not collide; publish that rewritten image at the name requested by
        // webgpu-host.js and thread-host.js.
        from(layout.buildDirectory.dir("graal")) {
            include("${wasmLMThreadOutputName}.js")
            include("${wasmLMThreadOutputName}.js.wasm")
            include("${wasmLMThreadOutputName}-agent.js.wasm")
            rename { name -> name.replace(wasmLMThreadOutputName, graalOutputName) }
            into("graal")
        }
        // Keep the suffixed artifact too. The threaded browser URL is deliberately
        // explicit (`image=minecraft-client-lm-threaded`), and the host derives both
        // the loader and agent URLs from that name. Publishing only the renamed base
        // image left an older manually staged threaded file in place after a rebuild,
        // so browser tests silently exercised stale Java code.
        from(layout.buildDirectory.dir("graal")) {
            include("${wasmLMThreadOutputName}.js")
            include("${wasmLMThreadOutputName}.js.wasm")
            include("${wasmLMThreadOutputName}-agent.js.wasm")
            into("graal")
        }
    }
    into(layout.buildDirectory.dir("web-graal"))
}

tasks.register("buildGraalWeb") {
    group = "build"
    description = "Build the real-JAR WebGPU checkpoint with GraalVM Web Image."
    dependsOn("stageGraalWeb", "stageMinecraftAudio")
}

tasks.register("printMinecraftClasspath") {
    group = "help"
    description = "Print the local 26.2 launcher libraries made available to TeaVM."
    doLast {
        println("TeaVM entry point: ${selectedMain}")
        println("Minecraft JAR: ${minecraftJar.asFile}")
        println("Minecraft libraries: ${minecraftLibraries.size()}")
        minecraftLibraries.each { println(it) }
    }
}

tasks.named("buildWasmGC") {
    dependsOn("stageWeb")
}
