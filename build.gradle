                        // NativeImage.writeToFile lands in the STBImageWrite
                        // stub -- a black icon written nowhere. It also allocates
                        // a full framebuffer's worth of buffer, shadow and
                        // NativeImage on the single frame that already carries
                        // the first terrain upload, and the OutOfMemoryError it
                        // threw there stopped every pipeline drawing for the
                        // rest of the run. Stub the trigger; nothing else calls
                        // takeAutoScreenshot.
                        def classNode = new org.objectweb.asm.tree.ClassNode()
                        new org.objectweb.asm.ClassReader(contents).accept(classNode, 0)
                        classNode.methods.findAll { method ->
                            method.name == "tryTakeScreenshotIfNeeded" && method.desc == "()V"
                        }.each { method ->
                            method.instructions.clear()
                            method.tryCatchBlocks.clear()
                            method.localVariables?.clear()
                            method.visibleLocalVariableAnnotations?.clear()
                            method.invisibleLocalVariableAnnotations?.clear()
                            method.instructions.add(new org.objectweb.asm.tree.InsnNode(
                                    org.objectweb.asm.Opcodes.RETURN
                            ))
                            method.maxStack = 0
                            method.maxLocals = 1
                            patchedAutoScreenshot++
                        }
                        def writer = new org.objectweb.asm.ClassWriter(
                                org.objectweb.asm.ClassWriter.COMPUTE_MAXS
                        )
                        classNode.accept(writer)
                        contents = writer.toByteArray()
                    }

                    if (entry.name.endsWith(".class")) {
                        def classNode = new org.objectweb.asm.tree.ClassNode()
                        new org.objectweb.asm.ClassReader(contents).accept(classNode, 0)
                        def classPatchCount = 0
                        def managementPatchCount = 0
                        def glfwPollEventsPatchCount = 0
                        def glfwFramebufferSizePatchCount = 0
                        def glfwSizeCallbackPatchCount = 0
                        def glfwWindowPosPatchCount = 0
                        def modelLayerProbePatchCount = 0
                        def bufferPutPatchCount = 0
                        def textureProbePatchCount = 0
                        classNode.methods.each { method ->
                            def bakeLayerCalls = method.instructions.findAll { instruction ->
                                instruction instanceof org.objectweb.asm.tree.MethodInsnNode
                                        && instruction.opcode == org.objectweb.asm.Opcodes.INVOKEVIRTUAL
                                        && instruction.owner == "net/minecraft/client/model/geom/EntityModelSet"
                                        && instruction.name == "bakeLayer"
                                        && instruction.desc == "(Lnet/minecraft/client/model/geom/ModelLayerLocation;)Lnet/minecraft/client/model/geom/ModelPart;"
                            }
                            bakeLayerCalls.each { call ->
                                method.instructions.insertBefore(
                                        call,
                                        new org.objectweb.asm.tree.LdcInsnNode(
                                                classNode.name + "." + method.name + method.desc
                                        )
                                )
                                call.opcode = org.objectweb.asm.Opcodes.INVOKESTATIC
                                call.owner = "dev/mcweb/graal/BrowserReloadDiagnostics"
                                call.name = "bakeLayer"
                                call.desc = "(Lnet/minecraft/client/model/geom/EntityModelSet;Lnet/minecraft/client/model/geom/ModelLayerLocation;Ljava/lang/String;)Lnet/minecraft/client/model/geom/ModelPart;"
                                call.itf = false
                                modelLayerProbePatchCount++
                            }
                            // Head-of-method probe on
                            // CommandEncoder.writeToTexture(GpuTexture,
                            // ByteBuffer, int, int, int, int, int, int): the
                            // last two ints are width and height. Reports the
                            // source buffer's capacity/position/limit so a
                            // "Copy would overrun the source buffer" failure
                            // says whether the allocation or the position is
                            // wrong. Diagnostic; -PgraalTextureProbe=true.
                            if (graalTextureProbe
                                    && classNode.name == "com/mojang/blaze3d/systems/CommandEncoder"
                                    && method.name == "writeToTexture"
                                    && method.desc == "(Lcom/mojang/blaze3d/textures/GpuTexture;Ljava/nio/ByteBuffer;IIIIII)V") {
                                def probeList = new org.objectweb.asm.tree.InsnList()
                                probeList.add(new org.objectweb.asm.tree.VarInsnNode(
                                        org.objectweb.asm.Opcodes.ALOAD, 2))
                                probeList.add(new org.objectweb.asm.tree.VarInsnNode(
                                        org.objectweb.asm.Opcodes.ILOAD, 7))
                                probeList.add(new org.objectweb.asm.tree.VarInsnNode(
                                        org.objectweb.asm.Opcodes.ILOAD, 8))
                                probeList.add(new org.objectweb.asm.tree.MethodInsnNode(
                                        org.objectweb.asm.Opcodes.INVOKESTATIC,
                                        "dev/mcweb/graal/BrowserTextureUploadProbe",
                                        "note", "(Ljava/nio/ByteBuffer;II)V", false))
                                method.instructions.insert(probeList)
                                textureProbePatchCount++
                            }
                            // ByteBuffer.put(ByteBuffer) is a bulk copy on a real
                            // JVM and a per-byte loop here: the JDK routes it
                            // through Unsafe, which the WasmGC backend can only
                            // implement as one
                            // WasmGCUnalignedUnsafeSupport.readArrayByte/
                            // writeArrayByte call per byte. Measured on
                            // hoplite.gg, StagedVertexBuffer.uploadDrawsToBuffers
                            // alone -- once per frame, from
                            // FeatureRenderDispatcher.prepareFrame -- was 2.94%
                            // of total frame time in that one call.
                            // BrowserBufferCompat.put reproduces the method's
                            // semantics exactly (position advance, same
                            // exceptions in the same order) and takes
                            // System.arraycopy when both sides are heap-backed,
                            // which they are on this path.
                            def bufferPutCalls = graalBufferPutBulk ? method.instructions.findAll { instruction ->
                                instruction instanceof org.objectweb.asm.tree.MethodInsnNode
                                        && instruction.opcode == org.objectweb.asm.Opcodes.INVOKEVIRTUAL
                                        && instruction.owner == "java/nio/ByteBuffer"
                                        && instruction.name == "put"
                                        && instruction.desc == "(Ljava/nio/ByteBuffer;)Ljava/nio/ByteBuffer;"
                            } : []
                            bufferPutCalls.each { call ->
                                // The virtual call already has (destination,
                                // source) on the stack in that order, so the
                                // static replacement needs no stack shuffling.
                                call.opcode = org.objectweb.asm.Opcodes.INVOKESTATIC
                                call.owner = "dev/mcweb/graal/BrowserBufferCompat"
                                call.name = "put"
                                call.desc = "(Ljava/nio/ByteBuffer;Ljava/nio/ByteBuffer;)Ljava/nio/ByteBuffer;"
                                call.itf = false
                                bufferPutPatchCount++
                            }
                            method.instructions.each { instruction ->
                                if (!(instruction instanceof org.objectweb.asm.tree.MethodInsnNode)
                                        || instruction.opcode != org.objectweb.asm.Opcodes.INVOKESTATIC) {
                                    return
                                }
                                if (instruction.owner == "org/lwjgl/system/MemoryUtil"
                                        && instruction.name == "memCopy"
                                        && instruction.desc == "(Ljava/nio/ByteBuffer;Ljava/nio/ByteBuffer;)V") {
                                    instruction.owner = "dev/mcweb/graal/BrowserBufferCompat"
                                    instruction.name = "copy"
                                    classPatchCount++
                                    return
                                }
                                // Browser frames are driven by the page host;
                                // DOM events are dispatched via
                                // BrowserInputCompat, so there is no native
                                // GLFW event queue to poll.
