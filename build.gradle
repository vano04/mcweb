buildscript {
    repositories {
        mavenCentral()
    }
    dependencies {
        classpath "org.ow2.asm:asm-tree:9.9"
    }
}

plugins {
    id "java"
    id "org.teavm" version "0.15.0"
}

group = "dev.mcweb"
version = "0.1.0-SNAPSHOT"

repositories {
    mavenCentral()
    maven { url = uri("https://libraries.minecraft.net") }
}

def minecraftJar = layout.projectDirectory.file("minecraft-26.2-client.jar")
def defaultProbeMain = "dev.mcweb.bootstrap.MinecraftJarProbe"
def selectedMain = providers.gradleProperty("mcWebMainClass").getOrElse(defaultProbeMain)
def defaultGraalMain = "dev.mcweb.graal.GraalMinecraftJarProbe"
def selectedGraalMain = providers.gradleProperty("graalMainClass").getOrElse(defaultGraalMain)
def serverWorkerGraalMain = "dev.mcweb.graal.BrowserWorkerServerMain"
def graalOutputName = providers.gradleProperty("graalOutputName").getOrElse("minecraft-26.2")
def graalMaxHeapSize = providers.gradleProperty("graalMaxHeapSize").getOrElse("2147483648")

/*
 * Build-host sizing.
 *
 * native-image defaults its builder heap to ~75% of system memory and its thread
 * count to half the CPUs. That is wrong at both ends: on an 8 GB machine 75% is
 * 6.5 GB and the Minecraft closure dies with OutOfMemoryError, while on a 64-core
 * host half the cores leaves throughput unused.
 *
 * The lever that matters on a small host is *threads*, not heap: each analysis
 * thread carries its own working set, so lowering parallelism lowers peak memory
 * and can make a build fit that otherwise cannot. Trading build speed for the
 * ability to finish at all is the right trade on a constrained machine.
 *
 * -Ob (quick build) is deliberately NOT used, however tempting: -O1 is load-bearing
 * here, because -O2 and -Ob both emit wasm functions past V8's 7,654,321-byte
 * limit and produce an image the browser refuses to instantiate. See the -O1
 * comment further down.
 *
 * Override either with -PgraalBuilderMemoryGb / -PgraalParallelism.
 */
def hostCpus = Runtime.runtime.availableProcessors()
def hostMemoryGb = 0
try {
    def osBean = java.lang.management.ManagementFactory.getOperatingSystemMXBean()
    hostMemoryGb = (int) (osBean.totalMemorySize / (1024L * 1024L * 1024L))
} catch (Throwable ignored) {
    // Non-HotSpot or a restricted bean: fall back to native-image's own defaults.
}
// Leave the OS ~2 GB; never promise less than 4 GB, which is below what this
// image needs anyway and lets native-image fail with its own clear message.
def graalBuilderMemoryGb = providers.gradleProperty("graalBuilderMemoryGb")
        .map { it as Integer }
// Measured peak for this image is ~8 GB, so 12 GB is ample and 24 GB is the cap
// for very large hosts. Reserve 4 GB, not 2: the Gradle daemon holds its own
// multi-hundred-MB heap in the same machine, and sizing to RAM-2 on a 16 GB host
// produced a builder that expanded to 11 GB and thrashed against swap instead of
// collecting. Leaving headroom makes the JVM collect rather than page.
        .getOrElse(hostMemoryGb > 0 ? Math.min(24, Math.max(4, hostMemoryGb - 4)) : 0)
// Roughly 1.5 GB of builder heap per analysis thread before memory, not CPU,
// becomes the limit.
def graalParallelism = providers.gradleProperty("graalParallelism")
        .map { it as Integer }
        .getOrElse(graalBuilderMemoryGb > 0
                ? Math.max(1, Math.min(hostCpus, (int) (graalBuilderMemoryGb / 1.5)))
                : 0)
def graalVmHome = providers.gradleProperty("graalVmHome")
        .orElse(providers.environmentVariable("GRAALVM_HOME"))
// Capture transform switches during configuration. Reading Project from a task
// action is deprecated in Gradle 9 and will be rejected when configuration cache
// becomes mandatory; Providers preserve the same command-line semantics without
// consulting Project at execution time.
def browserPrepareSpawnRadius = Integer.parseInt(
        providers.gradleProperty("mcwebPrepareSpawnRadius").getOrElse("1")
)
def browserInitialSpawnDiameter = Integer.parseInt(
        providers.gradleProperty("mcwebInitialSpawnDiameter").getOrElse("3")
)
def ap2SafepointEnabled = providers.gradleProperty("mcwebAp2Safepoint")
        .map { it != "0" }
        .getOrElse(true)
// Web Image compiler backend. `--tool:svm-wasm` defaults to WASMGC, where Java
// objects are Wasm-GC structs. Wasm-GC references are instance-local and cannot
// cross a Worker realm, so WASMGC can never host shared-heap Java threads on
// today's browsers. `-H:Backend=WASM` selects the WasmLM backend, whose Java
// heap lives in a linear memory that *can* be a SharedArrayBuffer. Threading
// work must target WASM; see docs/MULTITHREADING-REQUIREMENTS.md.
def graalBackend = providers.gradleProperty("graalBackend").getOrElse("WASMGC")
// `-PgraalDebugNames=true` emits the Wasm `name` custom section, so a CPU
// profile shows Java method names instead of `wasm-function[12345]`. Without it
// the Java half of a frame — about two thirds of it — is unattributable, which
// is how the port ended up optimising only the host-visible third.
// Off by default: it is a diagnostic build, and the section is large.
def graalDebugNames = providers.gradleProperty("graalDebugNames").getOrElse("false") == "true"
// A/B switch for the ByteBuffer.put(ByteBuffer) bulk-copy rewrite.
def graalBufferPutBulk = providers.gradleProperty("graalBufferPutBulk").getOrElse("true") == "true"
// Diagnostic probe on the texture upload path; off by default.
def graalTextureProbe = providers.gradleProperty("graalTextureProbe").getOrElse("false") == "true"

if (!minecraftJar.asFile.isFile()) {
    throw new GradleException("Missing minecraft-26.2-client.jar in the project root")
}

// tools/build.mjs resolves the official launcher's classpath from its vanilla
// version manifest and supplies it explicitly. Keeping the Gradle project
// dependent on that staged directory avoids scraping launcher logs or accepting
// a second launcher layout.
def minecraftLibraries = []
def jsr305Jar = new File(System.getProperty("user.home"),
        ".minecraft/libraries/com/google/code/findbugs/jsr305/3.0.2/jsr305-3.0.2.jar")
def explicitLibrariesDir = project.findProperty("mcLibrariesDir") ?: System.getenv("MC_LIBRARIES_DIR")
if (explicitLibrariesDir) {
    def librariesDir = new File(explicitLibrariesDir.toString())
    if (!librariesDir.isDirectory()) {
        throw new GradleException("mcLibrariesDir is not a directory: ${librariesDir}")
    }
    def suppliedJars = []
    librariesDir.eachFileRecurse(groovy.io.FileType.FILES) { file ->
        if (file.name.endsWith(".jar")) {
            suppliedJars.add(file)
        }
    }
    if (suppliedJars.isEmpty()) {
        throw new GradleException("mcLibrariesDir contains no .jar files: ${librariesDir}")
    }
    suppliedJars.sort { it.absolutePath }
    minecraftLibraries = suppliedJars
    logger.lifecycle("Minecraft libraries: ${suppliedJars.size()} from ${librariesDir}")
}
// The client JAR stays at its fixed project-root path: it is a RegularFile used by
// zip readers, task inputs and the dependency block, and rebinding it to an absolute
// path is not worth the risk. tools/build.mjs links the player's copy into place.

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

dependencies {
    // The supplied Mojang client JAR is the program being ported. It is kept
    // untouched and placed directly on TeaVM's input classpath.
    implementation files(minecraftJar)
    implementation files(minecraftLibraries)
    if (jsr305Jar.isFile()) {
        compileOnly files(jsr305Jar)
    }
    implementation teavm.libs.jso
}

sourceSets {
    graal {
        java.srcDir("src/graal/java")
    }
    // The WasmGC image needs a spurious-wakeup LockSupport because its Unsafe
    // park/unpark substitutions throw. Threaded WasmLM instead routes the real JDK
    // LockSupport through the builder-patched Unsafe methods and host Atomics.wait.
    feature {
        if (graalBackend != "WASMGC") {
            java.exclude("dev/mcweb/feature/Target_LockSupport_Web.java")
        }
    }
    // McwebDrainHolder is compiled in its own source set against the ORIGINAL
    // jar so the jar transform (browserMinecraftJar) can transplant its method
    // without a compile<->transform dependency cycle.
    drain {
        java.srcDir("src/drain/java")
    }
}

dependencies {
    drainImplementation files(minecraftJar)
}

dependencies {
    // Keep the Web Image path independent of TeaVM's reduced Java class
    // library. GraalVM supplies a Java 25 runtime and consumes the same
    // untouched Mojang JAR plus the launcher's verified dependencies.
    // The graal source set additionally compiles against the
    // browser-transformed JAR (see the dependencies block below) so the
    // compile-time ABI matches the runtime artifact — e.g. the frame pump
    // calls Minecraft.runTick, which the transform makes public.
    graalImplementation files(minecraftLibraries)
    if (jsr305Jar.isFile()) {
        graalCompileOnly files(jsr305Jar)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
    options.encoding = "UTF-8"
}

tasks.named("compileGraalJava", JavaCompile) {
    doFirst {
        if (!graalVmHome.isPresent()) {
            throw new GradleException(
                    "Set GRAALVM_HOME or -PgraalVmHome to Oracle GraalVM Web Image 25.1+"
            )
        }

        def graalHome = file(graalVmHome.get())
        def graalModules = new File(graalHome, "jmods")
        if (!graalModules.isDirectory()) {
            throw new GradleException("Invalid GraalVM home: ${graalHome}")
        }

        def svmWasmJar = new File(graalHome, "lib/svm/tools/svm-wasm/builder/svm-wasm.jar")
        if (!svmWasmJar.isFile()) {
            throw new GradleException("svm-wasm.jar not found at ${svmWasmJar}")
        }
        classpath = classpath.plus(files(svmWasmJar))
        options.compilerArgs.addAll([
                "--module-path", graalModules.absolutePath,
                "--add-modules", "org.graalvm.webimage.api"
        ])
    }
}

// Browser native-image features run at build time against SVM internals
// (e.g. registering a Parker factory the wasm backend omits). Compile them
// against the builder's svm.jar plus the public native-image API.
tasks.named("compileFeatureJava", JavaCompile) {
    doFirst {
        if (!graalVmHome.isPresent()) {
            throw new GradleException(
                    "Set GRAALVM_HOME or -PgraalVmHome to Oracle GraalVM Web Image 25.1+"
            )
        }
        def graalHome = file(graalVmHome.get())
        def graalModules = new File(graalHome, "jmods")
        def svmJar = new File(graalHome, "lib/svm/builder/svm.jar")
        def svmSharedJar = new File(graalHome, "lib/svm/builder/svm-shared.jar")
        def svmGuestStagingJar = new File(graalHome, "lib/svm/builder/svm-guest-staging.jar")
        if (!svmJar.isFile()) {
            throw new GradleException("svm.jar not found at ${svmJar}")
        }
        if (!svmSharedJar.isFile()) {
            throw new GradleException("svm-shared.jar not found at ${svmSharedJar}")
        }
        if (!svmGuestStagingJar.isFile()) {
            throw new GradleException("svm-guest-staging.jar not found at ${svmGuestStagingJar}")
        }
        // Netty's InternalLoggerFactory is replaced at build time by the
        // feature (see BrowserParkerFeature), so it must be compilable.
        // 25.2 split the annotation and OS-thread pointer types out of svm.jar.
        classpath = files(svmJar, svmSharedJar, svmGuestStagingJar, minecraftLibraries.findAll {
            it.name.startsWith("netty-common-")
        })
        options.compilerArgs.addAll([
                "--module-path", graalModules.absolutePath,
                "--add-modules", "org.graalvm.nativeimage"
        ])
    }
}

// The WasmLM backend ships two blockers for threaded Java: `@JS` bodies compile to
// stubs (`lowerJSBody` -> `getStub`), and `Thread.start0`/`Thread.isAlive` are
// substituted away. Both are fixed by rewriting a handful of exactly-counted builder
// methods and injecting MC-Web classes into the builder module with
// `--patch-module`; no file in the GraalVM install is touched. See
// docs/WASMLM-THREADS.md and tools/webimage-patch/.
def webImagePatchDir = layout.buildDirectory.dir("webimage-patch/classes")

tasks.register("webImagePatch", Exec) {
    group = "build"
    description = "Build the GraalVM Web Image builder patch that enables @JS and Thread.start() on WasmLM."
    inputs.dir(layout.projectDirectory.dir("src/webimage-patch/java"))
    inputs.file(layout.projectDirectory.file("tools/webimage-patch/McWebImagePatcher.java"))
    inputs.file(layout.projectDirectory.file("tools/webimage-patch/build.mjs"))
    inputs.file(layout.projectDirectory.file("tools/webimage-patch/PointstoPatcher.java"))
    outputs.dir(webImagePatchDir)

    doFirst {
        if (!graalVmHome.isPresent()) {
            throw new GradleException(
                    "Set GRAALVM_HOME or -PgraalVmHome to Oracle GraalVM Web Image 25.1+"
            )
        }
        environment("GRAALVM_HOME", file(graalVmHome.get()).absolutePath)
        // Node, not bash: this was the one step in the pipeline that needed a
        // shell, and it made the image unbuildable on Windows. Node is already a
        // hard dependency of the installer, and is on PATH for any build driven
        // through tools/build.mjs.
        commandLine(
                "node",
                file("tools/webimage-patch/build.mjs").absolutePath,
                webImagePatchDir.get().asFile.absolutePath
        )
    }
}

teavm {
    wasmGC {
        mainClass = selectedMain
        targetFileName = "minecraft-26.2.wasm"
        outputDir = file("$buildDir/web")
        relativePathInOutputDir = "wasm-gc"
        // The real Main reachability audit prioritizes actionable diagnostics;
        // the passing browser artifact uses production-oriented optimization.
        fastGlobalAnalysis = selectedMain != defaultProbeMain
        optimization = selectedMain == defaultProbeMain
                ? org.teavm.gradle.api.OptimizationLevel.AGGRESSIVE
                : org.teavm.gradle.api.OptimizationLevel.NONE
        obfuscated = false
        strict = true
        sourceMap = true
        debugInformation = true
        minDirectBuffersSize = 16
    }
}

tasks.register("stageWeb", Copy) {
    from(layout.projectDirectory.dir("web"))
    into(layout.buildDirectory.dir("web"))
}

tasks.register("buildWeb") {
    group = "build"
    description = "Compile the supplied Minecraft JAR probe to Wasm-GC and stage the browser shell."
    dependsOn("stageWeb", "buildWasmGC")
}

// The browser image has no jar on its virtual filesystem, so the vanilla
// resource pack serves image-embedded classpath resources. Embedded
// resources cannot be enumerated, so generate an index of every asset/data path
// for the pack's listResources at build time.
def assetIndexFile = layout.buildDirectory.file("generated/mcweb-asset-index.txt")
def generateAssetIndex = tasks.register("generateAssetIndex") {
    group = "build"
    description = "Index the supplied jar's assets/ and data/ trees for the browser resource pack."
    inputs.file(minecraftJar)
    outputs.file(assetIndexFile)
    doLast {
        def lines = []
        new java.util.zip.ZipFile(minecraftJar.asFile).withCloseable { archive ->
            archive.entries().each { entry ->
                if (!entry.directory
                        && (entry.name.startsWith("assets/") || entry.name.startsWith("data/"))
                        && !entry.name.endsWith("/")) {
                    def relative = entry.name
                    def separator = relative.indexOf('/')
                    def namespaceSeparator = relative.indexOf('/', separator + 1)
                    if (separator > 0 && namespaceSeparator > separator + 1
                            && namespaceSeparator < relative.length() - 1) {
                        lines.add(relative)
                    }
                }
            }
        }
        Collections.sort(lines)
        def out = assetIndexFile.get().asFile
        out.parentFile.mkdirs()
        out.setText(lines.join("\n") + "\n", "UTF-8")
        logger.lifecycle("asset index: ${lines.size()} entries")
    }
}

// The browser-input JAR is the resource-pack classpath in Web Image.  The
// native-image backend does not reliably expose files that exist only in a
// source-set output directory through Class.getResourceAsStream, even when
// -H:IncludeResources records their names.  Keep the player's local title
// assets in that same JAR-backed namespace and fail closed if the documented
// staging step was skipped or produced an incomplete set.
def requiredStagedMojangAssets = [
        (0..5).collect { index ->
            "src/graal/resources/assets/minecraft/textures/gui/title/background/panorama_${index}.png"
        },
        "src/graal/resources/assets/minecraft/textures/gui/title/background/panorama_overlay.png",
        "web/assets/minecraft.png",
        "web/assets/ascii_sga.png"
].flatten()
def requiredPanoramaNames = ((0..5).collect { index -> "panorama_${index}.png" }) + ["panorama_overlay.png"]
def validateStagedMojangAssets = tasks.register("validateStagedMojangAssets") {
    group = "build"
    description = "Verify the local Mojang-owned assets required by the browser image."
    inputs.files(requiredStagedMojangAssets.collect { file(it) })
    doLast {
        def missing = requiredStagedMojangAssets.findAll { !file(it).isFile() }
        if (!missing.isEmpty()) {
            throw new GradleException(
                    "Missing staged local Mojang assets (${missing.join(', ')}); "
                            + "run node tools/stage-mojang-assets.mjs first"
            )
        }
        def panoramaDir = file("src/graal/resources/assets/minecraft/textures/gui/title/background")
        def actualPanoramaNames = fileTree(panoramaDir).matching {
            include("panorama_*.png")
        }.files.collect { it.name }.sort()
        def expectedPanoramaNames = requiredPanoramaNames.sort()
        if (actualPanoramaNames != expectedPanoramaNames) {
            throw new GradleException(
                    "Expected exactly the six panorama faces plus overlay, found "
                            + actualPanoramaNames.join(', ')
            )
        }
        requiredStagedMojangAssets.each { relative ->
            def bytes = file(relative).bytes
            if (bytes.length < 8
                    || bytes[0] != (byte) 0x89
                    || bytes[1] != (byte) 0x50
                    || bytes[2] != (byte) 0x4e
                    || bytes[3] != (byte) 0x47) {
                throw new GradleException("Staged local asset is not a PNG: ${relative}")
            }
        }
        logger.lifecycle("validated staged local Mojang assets: ${requiredStagedMojangAssets.size()} PNG files")
    }
}

def browserMinecraftJar = tasks.register("browserMinecraftJar", Zip) {
    group = "build"
    description = "Create a browser-input copy of the immutable supplied client JAR with scoped compatibility patches."
    from(zipTree(minecraftJar)) {
        // The supplied client JAR has unusable 1x1 panorama placeholders. The
        // real player-local bytes are added below from the validated staging
        // tree, under the exact same resource paths.
        exclude("assets/minecraft/textures/gui/title/background/panorama_*.png")
    }
    from(assetIndexFile)
    from("src/graal/resources") {
        include("assets/minecraft/textures/gui/title/background/panorama_*.png")
    }
    dependsOn(generateAssetIndex, "drainClasses", validateStagedMojangAssets)
    // The helper bytecode is read and transplanted in doLast rather than
    // copied into the archive, so declare it explicitly as a task input.
    // Otherwise Gradle can reuse a stale transformed JAR after the helper
    // source changes.
    inputs.files(sourceSets.drain.output)
    exclude("META-INF/*.SF", "META-INF/*.RSA", "META-INF/*.DSA", "META-INF/SIG-*")
    // The supplied client jar ships 1x1 placeholder panorama cube faces; the
    // real 1024x1024 bytes live only in Mojang's content-addressed asset objects
    // and are checked into src/graal/resources/assets/... (the graal sourceSet
    // output precedes the jar on the image classpath, so it wins anyway).
    // Dropping the placeholders from the browser jar makes the embedded resource
    // set unambiguous and stops the 1x1 panorama faces from being baked into the
    // wasm (black background).
    // NOTE: the jar's font/include/unifont.json is an INTENTIONAL empty stub
    // ({"providers":[]}) that disables the CJK unifont provider; the real one
    // references unifont.zip / unifont_jp.zip which are NOT in the jar (they are
    // launcher-downloaded). Overriding it with the real file makes the font
    // system try to load those missing zips → "Default font failed to load" →
    // CompletionException → constructor abort. The stub is correct; do NOT
    // overlay or exclude it.
    archiveFileName = "minecraft-26.2-browser-input.jar"
    destinationDirectory = layout.buildDirectory.dir("transformed")
    preserveFileTimestamps = false
    reproducibleFileOrder = true
    // Store entries uncompressed: the built-in resource pack reads this jar
    // through java.util.zip inside the browser image, where Inflater has no
    // native zlib. Stored entries bypass decompression entirely.
    entryCompression = ZipEntryCompression.STORED

    doLast {
        // In the full Web Image, Block's static Guava cache is created with a
        // null final keyEquivalence field. Rewrite only the cache lookup method
        // to call an exact, cache-free copy of Block$1.load's geometry test.
        def blockEntryName = "net/minecraft/world/level/block/Block.class"
        def minecraftEntryName = "net/minecraft/client/Minecraft.class"
        def minecraftServerEntryName = "net/minecraft/server/MinecraftServer.class"
        def blockableEventLoopEntryName = "net/minecraft/util/thread/BlockableEventLoop.class"
        def integratedServerEntryName =
                "net/minecraft/client/server/IntegratedServer.class"
        def nbtIoEntryName = "net/minecraft/nbt/NbtIo.class"
        // ConnectScreen.connect spawns a thread that calls Netty's
        // Connection.connect(InetSocketAddress, ...), which this image does not
        // have. Route the whole method at the browser transport instead.
        def connectScreenEntryName = "net/minecraft/client/gui/screens/ConnectScreen.class"
        // SafetyScreen's Proceed built a JoinMultiplayerScreen and handed it to
        // Gui.setScreen, and nothing happened -- no screen change and no
        // exception anywhere, because mouse buttons dispatch outside frame().
        def safetyScreenEntryName =
                "net/minecraft/client/gui/screens/multiplayer/SafetyScreen.class"
        // A server-pushed resource pack is downloaded over HttpURLConnection
        // (absent here) and opened as a deflated zip (Inflater has no zlib
        // here). Both halves move to the page: the downloader is replaced, and
        // the pack it produces is a directory, so the resources supplier has to
        // become the Path one.
        def downloadedPackSourceEntryName =
                "net/minecraft/client/resources/server/DownloadedPackSource.class"
        // The manager accepts a pushed pack and never asks the downloader for
        // it. Everything outside this private state machine has been
        // eliminated, so trace its entry points rather than guess again; tick()
        // is scheduled, not per-frame, so this does not flood.
        def serverPackManagerEntryName =
                "net/minecraft/client/resources/server/ServerPackManager.class"
        // Web Image registers no `http` protocol handler, so vanilla's
        // `new URL(...)` here threw for every server pack and the client
        // answered the push with INVALID_URL.
        def clientCommonListenerEntryName =
                "net/minecraft/client/multiplayer/ClientCommonPacketListenerImpl.class"
        // The Resource Packs screen could never be opened: its directory
        // Watcher calls FileSystem.newWatchService(), which the in-memory
        // filesystem answers with UnsupportedOperationException, and
        // Watcher.create catches only IOException. The throw unwound out of a
        // DOM mouse handler, so the button was simply dead and silent.
        def packWatcherEntryName =
                "net/minecraft/client/gui/screens/packs/PackSelectionScreen\$Watcher.class"
        // Drawing a saved server entry submits its ping to a thread pool, and
        // starting a worker thread throws IllegalThreadStateException here. From
        // inside rendering that became "ReportedException: Rendering screen" on
        // the first frame showing a saved server: black screen, crash box. An
        // empty list draws no entry, so Direct Connection never hit it.
        def serverListEntryName =
                "net/minecraft/client/gui/screens/multiplayer/ServerSelectionList\$OnlineServerEntry.class"
        // Realms needs Mojang's Realms service and a subscription; nothing in
        // this port can reach it, so the button is greyed out rather than left
        // looking live.
        def titleScreenEntryName = "net/minecraft/client/gui/screens/TitleScreen.class"
        // RegistryDataLoader sends the per-entry causes of a registry load
        // failure to LOGGER.error and throws a crash report that names only
        // which entries failed. Log lines are invisible in this image, so
        // that one call is redirected to a reporter the stage ring can see.
        def registryDataLoaderEntryName = "net/minecraft/resources/RegistryDataLoader.class"
        // PlayerChunkSender's throttle is driven by a wall-clock estimate the
        // client measures across its own frames. In the browser the client and
        // the integrated server share one thread, so that estimate measures
        // frame scheduling rather than chunk cost and collapses the send rate.
        // Widen the throttle state so the browser pump can both observe it and
        // hold it to a floor.
        def playerChunkSenderEntryName =
                "net/minecraft/server/network/PlayerChunkSender.class"
        // ChunkMap.hasWork() stays true forever while nothing generates, which
        // means one of its dispatchers is holding queued work it never runs.
        // ChunkTaskDispatcher.pollTask() sets `sleeping` when popTasks()
        // returns null and is only woken by a later submit()/release(), so a
        // dispatcher can fall asleep on a non-empty queue. Widen the two
        // dispatchers and that flag so the heartbeat can name the culprit.
        def chunkMapEntryName = "net/minecraft/server/level/ChunkMap.class"
        def chunkTaskDispatcherEntryName =
                "net/minecraft/server/level/ChunkTaskDispatcher.class"
        // MainThreadExecutor.pollTask() returns true immediately when
        // runDistanceManagerUpdates() has work, skipping super.pollTask()
        // which processes the executor's own queue where chunk completion
        // callbacks land. During spawn finding the distance manager always
        // has work, so completions are never processed and the chunk future
        // in managedBlock never completes. Fix: always call super.pollTask().
        def mainThreadExecutorEntryName =
                "net/minecraft/server/level/ServerChunkCache\$MainThreadExecutor.class"
        // The first threaded world-load future is driven by NoiseBasedChunkGenerator's
        // background suppliers.  Keep a bounded phase marker around the supplier body:
        // the external watchdog can then distinguish a slow noise computation from a
