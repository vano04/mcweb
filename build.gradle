                                // browser resize reaches Minecraft. Retargeting
                                // is required, not cosmetic: the repo's
                                // org.lwjgl.glfw.GLFW shadow loses to
                                // lwjgl-glfw-3.4.1.jar on the image classpath,
                                // so Window registered these against real LWJGL
                                // (a no-op here), both callbacks stayed null,
                                // and every resize was silently dropped while
                                // the host stretched the last frame to fit.
                                // Runs earlier in Window's constructor than the
                                // callback registrations below, on the
                                // null-monitor branch that this port always
                                // takes. Real LWJGL's native binding stops
                                // construction here, so the retargets below are
                                // never reached.
