                                // the exact Minecraft management queries used
                                // by F3 debug entries, system reports, and
                                // uptime formatting to browser-safe stand-ins.
                                if (instruction.owner == "java/lang/management/ManagementFactory") {
                                    if (instruction.name == "getGarbageCollectorMXBeans"
                                            && instruction.desc == "()Ljava/util/List;") {
                                        instruction.owner = "dev/mcweb/graal/BrowserManagementCompat"
                                        patchedGarbageCollectorMxBeans++
                                        managementPatchCount++
                                    } else if (instruction.name == "getMemoryMXBean"
                                            && instruction.desc == "()Ljava/lang/management/MemoryMXBean;") {
                                        instruction.owner = "dev/mcweb/graal/BrowserManagementCompat"
                                        patchedMemoryMxBeans++
                                        managementPatchCount++
                                    } else if (instruction.name == "getRuntimeMXBean"
                                            && instruction.desc == "()Ljava/lang/management/RuntimeMXBean;") {
                                        instruction.owner = "dev/mcweb/graal/BrowserManagementCompat"
                                        patchedRuntimeMxBeans++
                                        managementPatchCount++
                                    }
                                }
                            }
                        }
                        if (classPatchCount != 0 || managementPatchCount != 0
                                || modelLayerProbePatchCount != 0
                                || bufferPutPatchCount != 0
                                || textureProbePatchCount != 0
                                || glfwPollEventsPatchCount != 0
                                || glfwFramebufferSizePatchCount != 0
                                || glfwSizeCallbackPatchCount != 0
                                || glfwWindowPosPatchCount != 0) {
                            def writer = new org.objectweb.asm.ClassWriter(
                                    org.objectweb.asm.ClassWriter.COMPUTE_MAXS
                            )
                            classNode.accept(writer)
                            contents = writer.toByteArray()
                            patchedMemoryCopies += classPatchCount
                            patchedModelLayerProbe += modelLayerProbePatchCount
                            patchedBufferPuts += bufferPutPatchCount
                            patchedGlfwPollEvents += glfwPollEventsPatchCount
                            patchedGlfwFramebufferSize += glfwFramebufferSizePatchCount
                            patchedGlfwSizeCallbacks += glfwSizeCallbackPatchCount
                            patchedGlfwWindowPos += glfwWindowPosPatchCount
                        }
                    }
                    def crc = new java.util.zip.CRC32()
                    crc.update(contents)
                    replacement.method = java.util.zip.ZipEntry.STORED
                    replacement.size = contents.length
                    replacement.compressedSize = contents.length
                    replacement.crc = crc.value
                    output.putNextEntry(replacement)
                    output.write(contents)
                } else {
                    replacement.method = java.util.zip.ZipEntry.STORED
                    replacement.size = 0L
                    replacement.compressedSize = 0L
                    replacement.crc = 0L
                    output.putNextEntry(replacement)
                }
                output.closeEntry()
            }
        } finally {
            output.close()
            input.close()
        }

        if (!patchedBlock || !patchedMinecraft || patchedMinecraftAsyncCalls != 1
                || patchedWorldLoadMarkers != 12
                || patchedWorldLoadReadyWait != 1
