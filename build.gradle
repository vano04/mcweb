                                    instruction.owner = "dev/mcweb/graal/BrowserWindowCompat"
                                    glfwSizeCallbackPatchCount++
                                    return
                                }
                                if (instruction.owner == "org/lwjgl/glfw/GLFW"
                                        && instruction.name == "glfwSetWindowSizeCallback"
                                        && instruction.desc == "(JLorg/lwjgl/glfw/GLFWWindowSizeCallbackI;)"
                                                + "Lorg/lwjgl/glfw/GLFWWindowSizeCallback;") {
                                    instruction.owner = "dev/mcweb/graal/BrowserWindowCompat"
                                    glfwSizeCallbackPatchCount++
                                    return
                                }
